<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ballon d'Or Winners - Male Football</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-section {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .search-section input,
        .search-section select {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            background: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-section input:focus,
        .search-section select:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .search-section input {
            min-width: 250px;
        }

        .search-section select {
            min-width: 200px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.95em;
        }

        .winners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .winner-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .winner-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .card-header .year {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-header .rank {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .card-body {
            padding: 20px;
        }

        .card-body .player-name {
            font-size: 1.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .card-body .info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.95em;
            color: #666;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 600;
            color: #667eea;
        }

        .value {
            text-align: right;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            color: #666;
        }

        .decade-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .decade-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .decade-winners {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .decade-winner-item {
            padding: 15px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 8px;
        }

        .decade-winner-item .year {
            font-weight: bold;
            color: #667eea;
        }

        .decade-winner-item .name {
            color: #333;
            margin-top: 5px;
            font-size: 0.95em;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }

            .search-section {
                flex-direction: column;
            }

            .search-section input,
            .search-section select {
                width: 100%;
            }

            .winners-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

            { year: 1956, player: "Stanley Matthews", club: "Blackpool", nationality: "England" }

        function getDecade(year) {
            const decade = Math.floor(year / 10) * 10;
            return decade + 's';
        }

        function renderWinners(data) {
            const container = document.getElementById('winnersContainer');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="no-results" style="grid-column: 1 / -1;">No winners found matching your criteria.</div>';
                return;
            }

            container.innerHTML = data.map((winner, index) => `
                <div class="winner-card">
                    <div class="card-header">
                        <div class="year">${winner.year}</div>
                        <div class="rank">#${index + 1}</div>
                    </div>
                    <div class="card-body">
                        <div class="player-name">${winner.player}</div>
                        <div class="info">
                            <div class="info-row">
                                <span class="label">Club</span>
                                <span class="value">${winner.club}</span>
                            </div>
                            <div class="info-row">
                                <span class="label">Nationality</span>
                                <span class="value">${winner.nationality}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterWinners() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const decade = document.getElementById('decadeFilter').value;

            let filtered = ballonDorData;

            if (searchTerm) {
                filtered = filtered.filter(w => 
                    w.player.toLowerCase().includes(searchTerm)
                );
            }

            if (decade) {
                filtered = filtered.filter(w => 
                    getDecade(w.year) === decade
                );
            }

            renderWinners(filtered);
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterWinners);
        document.getElementById('decadeFilter').addEventListener('change', filterWinners);

        // Initial render
        renderWinners(ballonDorData);
    </script>

</html>
